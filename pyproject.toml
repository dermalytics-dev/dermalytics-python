[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dermalytics"
version = "1.0.0"
description = "Python SDK for the Dermalytics API - Skincare Ingredient Analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31.0",
]
authors = [
    {name = "Dermalytics", email = "support@dermalytics.dev"}
]
keywords = ["skincare", "ingredients", "api", "dermatology", "cosmetics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/dermalytics-dev/dermalytics-python"
Documentation = "https://www.dermalytics.dev/docs"
Repository = "https://github.com/dermalytics-dev/dermalytics-python"
Issues = "https://github.com/dermalytics-dev/dermalytics-python/issues"
PyPI = "https://pypi.org/project/dermalytics/"

[tool.setuptools]
packages = ["dermalytics"]

[tool.setuptools.package-data]
dermalytics = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313', 'py314']

[tool.mypy]
# Current mypy supports 3.9+; package syntax and runtime support remain Python 3.8+.
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
